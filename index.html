<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6180</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <style>
    /* (same styles as before, unchanged) */
  </style>
  <script>
    function openFilePicker() {
      document.getElementById('file-input').click();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("file-input");

      input.addEventListener("change", function (e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        const readerPromises = files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = function (event) {
              resolve({
                fileName: file.name,
                dataUrl: event.target.result,
                type: file.type.startsWith("video") ? "video" : "image"
              });
            };
            reader.readAsDataURL(file);
          });
        });

        Promise.all(readerPromises).then(results => {
          localStorage.setItem("selectedPhotos", JSON.stringify(results));

          const folderId = crypto.randomUUID();
          window.location.href = `/app/save-album.html?folderId=${folderId}`;
        });
      });
    });
  </script>
</head>
<body>
  <div class="header">
    <img src="images/logo_no_background.png" alt="6180 Logo" />
    <div class="app-name">6180</div>
  </div>

  <div class="content">
    <h1>Create Albums To Share With Others</h1>
    <div class="button-group">
      <button class="button button-primary" onclick="openFilePicker()">Create Album</button>
      <a href="/app/my-albums.html" class="button button-secondary">View My Albums</a>
      <input type="file" id="file-input" accept="image/*,video/*" multiple style="display: none;">
    </div>
  </div>

  <div class="footer">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </div>
</body>
</html>
