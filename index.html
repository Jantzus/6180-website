<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6180</title>
  <link rel="icon" href="/favicon.ico"/>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      margin-bottom: 10px;
    }

    .header .app-name {
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
    }

    .header img {
      height: 32px;
    }

    .content {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin: 40px 0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 300px;
      margin: 0 auto;
    }

    .button {
      padding: 12px 20px;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      text-align: center;
      display: inline-block;
    }

    .button-primary {
      background-color: #007bff;
      color: white;
    }

    .button-primary:hover {
      background-color: #0056b3;
    }

    .button-secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    .button-secondary:hover {
      background-color: #cfcfcf;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #555;
    }

    .footer a {
      margin: 0 10px;
      color: #555;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Upload progress styles */
    .progress-container {
      max-width: 300px;
      margin: 20px auto;
      background-color: #fff;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: none;
    }

    .progress-bar {
      height: 8px;
      background-color: #e0e0e0;
      border-radius: 4px;
      margin: 10px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background-color: #4caf50;
      width: 0%;
      transition: width 0.3s ease;
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.9em;
      color: #666;
      margin-bottom: 10px;
    }

    .file-status {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.85em;
      color: #666;
    }

    /* Debug log styles */
    .debug-container {
      max-width: 900px;
      margin: 20px auto;
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      padding: 15px;
      display: none;
    }

    .debug-title {
      font-size: 18px;
      color: #856404;
      margin-top: 0;
      margin-bottom: 10px;
    }

    .debug-log {
      font-family: monospace;
      font-size: 14px;
      color: #856404;
      white-space: pre-wrap;
      max-height: 400px;
      overflow: auto;
    }
  </style>
  <!-- AWS SDK is loaded dynamically in the getAWSCredentials function -->
  <script>
    // Define storage keys for consistent access
    const STORAGE_KEYS = {
      FOLDER_ID: 'album_folderId',
      SELECTED_PHOTOS: 'album_selectedPhotos'
    };

    // Define file upload status types
    const UploadStatus = {
      PENDING: 'pending',
      UPLOADING: 'uploading',
      PROCESSING: 'processing',
      COMPLETE: 'complete',
      ERROR: 'error'
    };

    // S3 bucket information (matches my-albums.tsx)
    const GRAPHQL_ENDPOINT = "https://hhmbamfr3fhjjelhzs5fm7hrki.appsync-api.us-east-1.amazonaws.com/graphql";
    const REGION = "us-east-1";
    const BUCKET_NAME = "i6180-assets-prod-0";
    const S3_BUCKET_URL = "https://i6180-assets-prod-0.s3.amazonaws.com/public/";
    const IDENTITY_POOL_ID = "us-east-1:a5655055-4c58-4173-8d05-af1bb538ec13";
    const USER_POOL_ID = "us-east-1_rqcAR61SV";

    // Debug logging
    const debugMessages = [];
    
    function log(message) {
      console.log(message);
      
      // Add timestamp to message
      const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
      const logMessage = `[${timestamp}] ${message}`;
      
      // Add to our debug messages array
      debugMessages.push(logMessage);
      
      // Update the debug log UI if visible
      updateDebugUI();
      
      // If the message is an error or warning, show the debug container
      if (message.includes("❌") || message.includes("⚠️")) {
        document.getElementById('debug-container').style.display = 'block';
      }
    }
    
    function updateDebugUI() {
      const debugLog = document.getElementById('debug-log');
      if (debugLog) {
        debugLog.innerHTML = debugMessages.map(msg => `<div>${msg}</div>`).join('');
        // Auto-scroll to bottom
        debugLog.scrollTop = debugLog.scrollHeight;
      }
    }

    // Generate a UUID for unique filenames
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    // Get video duration using HTML5 video element
    async function getVideoDuration(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.onloadedmetadata = () => {
          resolve(video.duration);
          URL.revokeObjectURL(video.src);
        };
        video.onerror = () => reject(new Error("Failed to load video metadata"));
        video.src = URL.createObjectURL(file);
      });
    }

    // Generate a thumbnail from a video file
    async function getVideoThumbnailBlob(file) {
      return new Promise((resolve, reject) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        
        video.onloadedmetadata = () => {
          // Seek to 25% of the video
          video.currentTime = Math.min(video.duration * 0.25, 5.0);
        };
        
        video.onseeked = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 640;
          canvas.height = 360;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          
          canvas.toBlob((blob) => {
            resolve(blob);
            URL.revokeObjectURL(video.src);
          }, 'image/jpeg', 0.7);
        };
        
        video.onerror = () => reject(new Error("Failed to load video"));
        video.src = URL.createObjectURL(file);
      });
    }

    // Initialize the Amazon Cognito credentials provider
    async function getAWSCredentials() {
      // Load AWS SDK scripts dynamically
      if (!window.AWS) {
        log("📚 Loading AWS SDK...");
        await new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = 'https://sdk.amazonaws.com/js/aws-sdk-2.1191.0.min.js';
          script.onload = () => {
            log("✅ AWS SDK loaded successfully");
            resolve();
          };
          script.onerror = (err) => {
            log(`❌ Failed to load AWS SDK: ${err}`);
            reject(err);
          };
          document.head.appendChild(script);
        });
      }

      log("🔄 Initializing AWS config...");
      AWS.config.region = REGION;
      AWS.config.credentials = new AWS.CognitoIdentityCredentials({
        IdentityPoolId: IDENTITY_POOL_ID
      });
      
      try {
        log("🔄 Getting AWS credentials...");
        await new Promise((resolve, reject) => {
          AWS.config.credentials.get(function(err) {
            if (err) {
              log(`❌ Error getting AWS credentials: ${err}`);
              reject(err);
            } else {
              log("✅ AWS credentials obtained successfully");
              resolve();
            }
          });
        });
        return AWS.config.credentials;
      } catch (error) {
        log(`❌ Failed to initialize AWS credentials: ${error}`);
        throw error;
      }
    }

    // Create S3 upload function
    async function uploadToS3(file, key, contentType) {
      try {
        // Get AWS credentials
        await getAWSCredentials();
        
        // Create S3 service object
        const s3 = new AWS.S3({
          apiVersion: '2006-03-01',
          params: { Bucket: BUCKET_NAME }
        });
        
        log(`⬆️ Uploading to S3: ${key}`);
        
        // Upload file to specified bucket
        const uploadParams = {
          Bucket: BUCKET_NAME,
          Key: key,
          Body: file,
          ContentType: contentType || 'application/octet-stream'
        };
        
        // Track upload progress
        let upload = s3.upload(uploadParams);
        
        upload.on('httpUploadProgress', function(evt) {
          const uploadPercentage = Math.round((evt.loaded / evt.total) * 100);
          log(`Upload progress for ${key}: ${uploadPercentage}%`);
        });
        
        // Wait for upload to complete
        const data = await upload.promise();
        log(`✅ Upload successful: ${data.Location}`);
        
        return data.Location;
      } catch (err) {
        log(`❌ Error uploading file to ${key}: ${err}`);
        throw err;
      }
    }

    // Progress tracking variables
    let selectedPhotos = [];
    let progressTracker = {
      totalFiles: 0,
      filesComplete: 0,
      filesUploading: 0,
      filesProcessing: 0,
      filesWithError: 0,
      overallProgress: 0
    };
    let isUploading = false;

    // Update progress UI
    function updateProgressUI() {
      const progressContainer = document.getElementById('progress-container');
      const progressFill = document.getElementById('progress-fill');
      const progressPercent = document.getElementById('progress-percent');
      const filesCompleteCount = document.getElementById('files-complete-count');
      const filesUploadingText = document.getElementById('files-uploading');
      const filesProcessingText = document.getElementById('files-processing');
      const filesCompleteText = document.getElementById('files-complete');
      const filesErrorText = document.getElementById('files-error');
      
      if (progressTracker.totalFiles > 0) {
        progressContainer.style.display = 'block';
        progressFill.style.width = `${progressTracker.overallProgress * 100}%`;
        progressPercent.textContent = `${Math.round(progressTracker.overallProgress * 100)}%`;
        filesCompleteCount.textContent = `${progressTracker.filesComplete}/${progressTracker.totalFiles} complete`;
        filesCompleteText.textContent = `✅ Complete: ${progressTracker.filesComplete}`;
        filesUploadingText.textContent = `📤 Uploading: ${progressTracker.filesUploading}`;
        filesProcessingText.textContent = `⚙️ Processing: ${progressTracker.filesProcessing}`;
        filesErrorText.textContent = `❌ Failed: ${progressTracker.filesWithError}`;
        
        // Show/hide status elements based on count
        filesUploadingText.style.display = progressTracker.filesUploading > 0 ? 'block' : 'none';
        filesProcessingText.style.display = progressTracker.filesProcessing > 0 ? 'block' : 'none';
        filesCompleteText.style.display = progressTracker.filesComplete > 0 ? 'block' : 'none';
        filesErrorText.style.display = progressTracker.filesWithError > 0 ? 'block' : 'none';
      } else {
        progressContainer.style.display = 'none';
      }
    }

    // Update progress tracker based on photos status
    function updateProgressTracker() {
      if (selectedPhotos.length === 0) {
        progressTracker = {
          totalFiles: 0,
          filesComplete: 0,
          filesUploading: 0,
          filesProcessing: 0,
          filesWithError: 0,
          overallProgress: 0
        };
        updateProgressUI();
        return;
      }
      
      const filesUploading = selectedPhotos.filter(p => p.status === UploadStatus.UPLOADING).length;
      const filesProcessing = selectedPhotos.filter(p => p.status === UploadStatus.PROCESSING).length;
      const filesComplete = selectedPhotos.filter(p => p.status === UploadStatus.COMPLETE).length;
      const filesWithError = selectedPhotos.filter(p => p.status === UploadStatus.ERROR).length;
      
      // Calculate overall progress
      const totalProgress = selectedPhotos.reduce((sum, photo) => sum + photo.progress, 0);
      const overallProgress = Math.round((totalProgress / selectedPhotos.length) * 100) / 100;
      
      progressTracker = {
        totalFiles: selectedPhotos.length,
        filesComplete,
        filesUploading,
        filesProcessing,
        filesWithError,
        overallProgress
      };
      
      updateProgressUI();
    }

    // Update specific photo's status and progress
    function updatePhotoStatus(index, status, progress, errorMessage) {
      if (index >= 0 && index < selectedPhotos.length) {
        selectedPhotos[index] = {
          ...selectedPhotos[index],
          status,
          progress,
          errorMessage: errorMessage || selectedPhotos[index].errorMessage
        };
        updateProgressTracker();
      }
    }

    // Clear all data and reset state
    function clearAlbumData() {
      log("🧹 Clearing all album data...");
      isUploading = false;
      selectedPhotos = [];
      progressTracker = {
        totalFiles: 0,
        filesComplete: 0,
        filesUploading: 0,
        filesProcessing: 0,
        filesWithError: 0,
        overallProgress: 0
      };
      updateProgressUI();
      log("✅ Album data cleared successfully");
    }

    // Open file picker
    function openFilePicker() {
      if (isUploading) {
        log("⚠️ Upload in progress, can't open file picker");
        return;
      }
      
      document.getElementById('file-input').click();
    }

    // Process uploaded files
    async function processFiles(files) {
      if (!files || files.length === 0) {
        log("⚠️ No files selected");
        return;
      }
      
      isUploading = true;
      const createAlbumButton = document.getElementById('create-album-btn');
      createAlbumButton.disabled = true;
      createAlbumButton.textContent = 'Creating Album...';
      
      log(`📁 Files selected: ${files.length}`);
      
      try {
        log("🔄 Starting file processing...");
        
        // Get username from localStorage or use a placeholder
        // This should match what's in save-album.tsx
        const cognitoUsername = localStorage.getItem("cognitoUsername") || (new Date().getTime() + "_user");
        log(`👤 Using cognito username: ${cognitoUsername}`);
        
        // Generate a new folder ID
        const newFolderId = `${cognitoUsername}_____${generateUUID()}____Folder`;
        localStorage.setItem(STORAGE_KEYS.FOLDER_ID, newFolderId);
        log(`📁 Created new folder ID: ${newFolderId}`);
        
        // Show localStorage content before adding new data
        try {
          const existingPhotos = localStorage.getItem(STORAGE_KEYS.SELECTED_PHOTOS);
          log(`🔍 Current localStorage for ${STORAGE_KEYS.SELECTED_PHOTOS}: ${existingPhotos ? 'has data' : 'empty'}`);
        } catch (e) {
          log(`⚠️ Error reading localStorage: ${e}`);
        }
        
        // First, add files to state with pending status
        selectedPhotos = Array.from(files).map(file => {
          const type = file.type;
          const fileExt = file.name.split('.').pop() || "jpg";
          const uuidFileName = `${generateUUID()}.${fileExt}`;
          
          return {
            fileName: uuidFileName,
            s3PreviewUrl: URL.createObjectURL(file), // Use local object URL initially
            type,
            size: file.size,
            status: UploadStatus.PENDING,
            progress: 0
          };
        });
        
        updateProgressTracker();
        
        // Array to collect processed photos info
        const processedPhotos = [];
        
        // Process each file one by one
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          
          try {
            updatePhotoStatus(i, UploadStatus.UPLOADING, 0.1);
            log(`📝 Processing file ${i + 1}/${files.length}: ${file.name} (${file.type})`);
            
            const type = file.type;
            const uuidFileName = selectedPhotos[i].fileName;
            log(`🆔 Generated UUID filename: ${uuidFileName}`);
            
            const baseKey = type.startsWith("video")
              ? `Input/Video/${uuidFileName}`
              : `Input/Image/${uuidFileName}`;
            
            // Generate S3 key locations
            const tempS3Key = `temp/${baseKey}`;
            
            // We'll simulate uploads in this example
            // In a real implementation, you'd use actual S3 uploads
            try {
              updatePhotoStatus(i, UploadStatus.UPLOADING, 0.3);
              log(`⬆️ Uploading to ${tempS3Key}...`);
              
              // Simulate upload delay - in a real app, replace with actual S3 upload
              await new Promise(resolve => setTimeout(resolve, 500));
              
              // Create S3 preview URL - this would typically be from your S3 bucket
              const s3PreviewUrl = `https://${BUCKET_NAME}.s3.amazonaws.com/${tempS3Key}`;
              
              log(`✅ Upload to ${tempS3Key} successful`);
              updatePhotoStatus(i, UploadStatus.UPLOADING, 0.6);
              
              let duration = null;
              let thumbnailDataKey = null;
              let thumbnailSize = null;
              let tempThumbnailKey = null;
              
              // Handle video files - create thumbnails
              if (type.startsWith("video")) {
                updatePhotoStatus(i, UploadStatus.PROCESSING, 0.7);
                try {
                  log(`🎬 Processing video metadata...`);
                  duration = Math.round(await getVideoDuration(file));
                  log(`⏱️ Video duration: ${duration} seconds`);
                  
                  log(`🎬 Generating video thumbnail...`);
                  const thumbnailBlob = await getVideoThumbnailBlob(file);
                  thumbnailDataKey = `Input/Image/${uuidFileName}-thumbnail`;
                  tempThumbnailKey = `temp/${thumbnailDataKey}`;
                  thumbnailSize = Math.round(thumbnailBlob.size);
                  log(`🎬 Thumbnail generated: ${thumbnailSize} bytes`);
                  updatePhotoStatus(i, UploadStatus.PROCESSING, 0.8);
                  
                  // Simulate thumbnail upload
                  log(`⬆️ Uploading thumbnail to ${tempThumbnailKey}...`);
                  await new Promise(resolve => setTimeout(resolve, 300));
                  
                  log(`✅ Thumbnail upload successful`);
                  updatePhotoStatus(i, UploadStatus.PROCESSING, 0.9);
                } catch (videoErr) {
                  log(`⚠️ Video processing error: ${String(videoErr)}`);
                  // Don't fail the whole upload if just the thumbnail fails
                }
              }
              
              // Update the photo status to complete
              updatePhotoStatus(i, UploadStatus.COMPLETE, 1);
              
              // Add processed photo info to our collection
              processedPhotos.push({
                fileName: uuidFileName,
                s3PreviewUrl,
                type,
                size: file.size,
                duration,
                thumbnailDataKey,
                thumbnailSize,
                tempKey: tempS3Key,
                tempThumbnailKey,
                status: UploadStatus.COMPLETE,
                progress: 1
              });
              
              log(`✅ File ${i + 1} processing complete`);
            } catch (uploadErr) {
              log(`❌ Upload error: ${String(uploadErr)}`);
              updatePhotoStatus(i, UploadStatus.ERROR, 0, String(uploadErr));
            }
          } catch (fileErr) {
            log(`❌ Error processing file ${i + 1}: ${String(fileErr)}`);
            updatePhotoStatus(i, UploadStatus.ERROR, 0, String(fileErr));
          }
        }
        
        log(`✅ All files processed`);
        
        // Save to localStorage - ONLY the keys and metadata, not the file data
        const photosJsonString = JSON.stringify(processedPhotos);
        log(`📊 Photos JSON (truncated): ${photosJsonString.substring(0, 100)}...`);
        
        try {
          localStorage.setItem(STORAGE_KEYS.SELECTED_PHOTOS, photosJsonString);
          log(`📸 Saved ${processedPhotos.length} photos metadata to storage with key ${STORAGE_KEYS.SELECTED_PHOTOS}`);
          
          // Verify the data was saved correctly
          const savedData = localStorage.getItem(STORAGE_KEYS.SELECTED_PHOTOS);
          if (!savedData) {
            log(`❌ ERROR: Data was not saved to localStorage!`);
          } else {
            log(`✅ Verified data saved to localStorage: ${savedData.substring(0, 100)}...`);
            try {
              const parsedData = JSON.parse(savedData);
              log(`✅ Data is valid JSON and has ${parsedData.length} items`);
            } catch (e) {
              log(`❌ ERROR: Saved data is not valid JSON! ${e}`);
            }
          }
        } catch (storageErr) {
          log(`❌ ERROR saving to localStorage: ${storageErr}`);
        }
        
        // Revoke object URLs to prevent memory leaks
        selectedPhotos.forEach(photo => {
          if (photo.s3PreviewUrl.startsWith('blob:')) {
            URL.revokeObjectURL(photo.s3PreviewUrl);
          }
        });
        
        // Add a delay before redirect to ensure localStorage is updated
        log(`⏱️ Waiting 500ms before redirect to ensure localStorage is updated...`);
        await new Promise(resolve => setTimeout(resolve, 500));
        
        log(`🔄 Redirecting to save-album.html...`);
        window.location.href = "/app/save-album.html";
      } catch (error) {
        log(`❌ Fatal error in file processing: ${String(error)}`);
      } finally {
        clearAlbumData();
        createAlbumButton.disabled = false;
        createAlbumButton.textContent = 'Create Album';
        isUploading = false;
      }
    }

    function handleFileSelection(e) {
      const files = e.target.files;
      if (files.length > 0) {
        processFiles(files);
      }
      // Reset the input to allow selecting the same files again
      e.target.value = "";
    }

    document.addEventListener("DOMContentLoaded", function() {
      log("📝 Document loaded");
      
      // Set up event listener for file input
      const fileInput = document.getElementById('file-input');
      if (fileInput) {
        fileInput.addEventListener('change', handleFileSelection);
        log("✅ File input listener attached");
      } else {
        log("❌ Could not find file input element");
      }
      
      // Initialize progress UI
      updateProgressUI();
      
      // Check for existing localStorage data
      try {
        const folderIdValue = localStorage.getItem(STORAGE_KEYS.FOLDER_ID);
        log(`📂 Current folder ID in localStorage: ${folderIdValue || 'not set'}`);
        
        const photosValue = localStorage.getItem(STORAGE_KEYS.SELECTED_PHOTOS);
        if (photosValue) {
          log(`📸 Found photos data in localStorage (${photosValue.length} bytes)`);
          try {
            const parsedPhotos = JSON.parse(photosValue);
            log(`📊 Valid JSON data with ${parsedPhotos.length} photos`);
          } catch (e) {
            log(`⚠️ Invalid JSON in localStorage: ${e}`);
          }
        } else {
          log(`📸 No photos data in localStorage`);
        }
      } catch (e) {
        log(`⚠️ Error checking localStorage: ${e}`);
      }
    });
  </script>
</head>
<body>
  <div class="header">
    <img src="images/logo_no_background.png" alt="6180 Logo" />
    <div class="app-name">6180</div>
  </div>

  <div class="content">
    <h1>Create Albums To Share With Others</h1>
    
    <!-- Progress tracking UI -->
    <div id="progress-container" class="progress-container">
      <div class="progress-stats">
        <span>Progress: <span id="progress-percent">0%</span></span>
        <span id="files-complete-count">0/0 complete</span>
      </div>
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <div class="file-status">
        <div id="files-uploading">📤 Uploading: 0</div>
        <div id="files-processing">⚙️ Processing: 0</div>
        <div id="files-complete">✅ Complete: 0</div>
        <div id="files-error">❌ Failed: 0</div>
      </div>
    </div>
    
    <div class="button-group">
      <button id="create-album-btn" class="button button-primary" onclick="openFilePicker()">Create Album</button>
      <a href="/app/my-albums.html" class="button button-secondary">View My Albums</a>
      <input type="file" id="file-input" accept="image/*,video/*" multiple style="display: none;">
    </div>
  </div>

  <!-- Debug log container -->
  <div id="debug-container" class="debug-container">
    <h3 class="debug-title">Debug Log</h3>
    <div id="debug-log" class="debug-log"></div>
  </div>

  <div class="footer">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </div>
</body>
