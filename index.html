    body {

      padding: 0;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      margin-bottom: 10px;
    }

    .header .logo-container {
      display: flex;
      align-items: center;
    }

    .header .app-name {
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
      margin-left: 10px;
    }

    .header img {
      height: 32px;
    }

    .language-selector {
      position: relative;
      display: inline-block;
    }

    .language-button {
      background-color: transparent;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .language-options {
      display: none;
      position: absolute;
      right: 0;
      background-color: white;
      min-width: 200px;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 4px;
    }

    .language-options a {
      color: black;
      padding: 8px 12px;
      text-decoration: none;
      display: block;
      text-align: left;
    }

    .language-options a:hover {
      background-color: #f1f1f1;
    }

    .show {
      display: block;
    }

    .content {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin: 40px 0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 300px;
      margin: 0 auto;
    }

    .button {
      padding: 12px 20px;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      text-align: center;
      display: inline-block;
    }

    .button-primary {
      background-color: #007bff;
      color: white;
    }

    .button-primary:hover {
      background-color: #0056b3;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #555;
    }

    .footer a {
      margin: 0 10px;
      color: #555;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    [dir="rtl"] .header .logo-container {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .header .app-name {
      margin-right: 10px;
      margin-left: 0;
    }

    [dir="rtl"] .language-options {
      left: 0;
      right: auto;
    }

    [dir="rtl"] .language-options a {
      text-align: right;
    }
  </style>
</head>

    <div class="language-selector">

    // Default language should be first in the list for initial loading
    let currentLang = "en-US";
    
    // Function to populate language dropdown
    function populateLanguageDropdown() {
      const dropdown = document.getElementById("languageDropdown");
      dropdown.innerHTML = ""; // Clear existing options
      
      // Sort languages alphabetically by name
      const sortedLangs = Object.values(languages).sort((a, b) => {
        return a.name.localeCompare(b.name);
      });
      
      // Add each language to dropdown
      sortedLangs.forEach(lang => {
        const langOption = document.createElement("a");
        langOption.href = "#";
        langOption.textContent = lang.name;
        langOption.setAttribute("data-lang", lang.code);
        langOption.onclick = function(e) {
          e.preventDefault();
          changeLanguage(lang.code);
          toggleLanguageDropdown();
        };
        dropdown.appendChild(langOption);
      });
    }
    
    // Toggle language dropdown visibility
    function toggleLanguageDropdown() {
      document.getElementById("languageDropdown").classList.toggle("show");
    }
    
    // Close dropdown when clicking outside
    window.onclick = function(event) {
      if (!event.target.matches('.language-button') && !event.target.matches('.language-button span')) {
        const dropdowns = document.getElementsByClassName("language-options");
        for (let i = 0; i < dropdowns.length; i++) {
          const openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    };
    
    // Function to change language
    function changeLanguage(langCode) {
      // Update current language
      currentLang = langCode;
      
      // Set language in HTML attributes
      document.documentElement.lang = langCode;
      
      // Set direction (RTL/LTR)
      const dir = languages[langCode].dir;
      document.documentElement.dir = dir;
      
      // Update content
      updateContent(langCode);
      
      // Save preference
      saveLanguagePreference(langCode);
      
      // Update displayed language
      document.getElementById("current-language").textContent = languages[langCode].name;
    }
    
    // Update content based on language
    function updateContent(langCode) {
      // If translation doesn't exist, fall back to generic or English
      let translationSet = translations[langCode];
      
      // If specific language version doesn't exist, try generic
      if (!translationSet) {
        const genericLang = langCode.split('-')[0];
        translationSet = translations[genericLang];
      }
      
      // If still no translation, use English
      if (!translationSet) {
        translationSet = translations["en"];
      }
      
      // Update text elements
      document.getElementById("headline").textContent = translationSet.headline;
      document.getElementById("create-album-btn").textContent = translationSet.createAlbum;
      document.getElementById("terms-link").textContent = translationSet.termsOfService;
      document.getElementById("privacy-link").textContent = translationSet.privacyPolicy;
      document.getElementById("support-link").textContent = translationSet.support;
    }
    
    // Save language preference
    function saveLanguagePreference(langCode) {
      localStorage.setItem("user_language", langCode);
    }
    
    // Load saved language preference
    function loadLanguagePreference() {
      const savedLang = localStorage.getItem("user_language");
      if (savedLang && languages[savedLang]) {
        changeLanguage(savedLang);
      } else {
        // Try to detect browser language
        detectBrowserLanguage();
      }
    }
    
    // Detect browser language
    function detectBrowserLanguage() {
      const browserLang = navigator.language || navigator.userLanguage;
      
      // Check if we have an exact match
      if (languages[browserLang]) {
        changeLanguage(browserLang);
        return;
      }
      
      // Check if we have a generic match (e.g., "en" for "en-US")
      const genericLang = browserLang.split('-')[0];
      if (languages[genericLang]) {
        changeLanguage(genericLang);
        return;
      }
      
      // Default to English
      changeLanguage("en-US");
    }
    
    // Navigation function
    function goToAlbums() {
      // Pass the language parameter to the next page
      window.location.href = "/app/my-albums.html?lang=" + currentLang;
    }
    
    // Initialize
    document.addEventListener("DOMContentLoaded", function() {
      populateLanguageDropdown();
      loadLanguagePreference();
    });
  </script>
