<!DOCTYPE html>

  <title>Invitation</title>
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    .content {
      text-align: left;
    }
    .centered-link {
      display: block;
      text-align: center;
      margin: 20px 0;
    }
    a, button {
      display: inline-block;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      border: none;
    }
    a:hover, button:hover {
      background-color: #45a049;
    }
    .error {
      color: red;
      font-weight: bold;
    }
    .small-text {
      font-size: 0.8em;
      color: #555;
    }
    .centered-italic {
      text-align: center;
      font-style: italic;
      font-size: 0.7em;
      color: #666;
      margin-bottom: 30px;
    }
  </style>
</head>

      function isValidName(name) {
        const namePattern = /^[A-Za-z0-9-]+$/;
        return namePattern.test(name);
      }

      function getTimeFromUUIDv1(uuid) {
        if (!uuid || uuid.length < 13) return null;
        const uuidTimestamp = uuid.substring(0, 13);
        const uuidEpoch = 122192928000000000;
        const timestampIn100Ns = parseInt(uuidTimestamp, 16);
        const timestampInMs = (timestampIn100Ns - uuidEpoch) / 10000;
        const date = new Date(timestampInMs);

        if (date.getFullYear() < 1900) return null;
        return date;
      }
