      function isValidName(name) {
        const namePattern = /^[A-Za-z0-9-]+$/;
        return namePattern.test(name);
      }

      function getTimeFromUUIDv1(uuid) {
        if (!uuid || uuid.length < 13) return null;
        const uuidTimestamp = uuid.substring(0, 13);
        const uuidEpoch = 122192928000000000;
        const timestampIn100Ns = parseInt(uuidTimestamp, 16);
        const timestampInMs = (timestampIn100Ns - uuidEpoch) / 10000;
        const date = new Date(timestampInMs);

        if (date.getFullYear() < 1900) return null;
        return date;
      }

      function getPositionalUrlParameters() {
        const queryString = window.location.search.substring(1);
        const params = queryString.split("+");

        return {
          name: params[0] || 'User',
          accessCode: params[1] || ''
        };
      }

      function setTitle(name, dateTime, titleTemplate) {
        const title = titleTemplate.replace("{name}", name).replace("{time}", dateTime);
        document.getElementById('title').textContent = title;
      }

            "accessCodeFailure": "无法复制访问代码。",

            "accessCodeError": "錯誤：無效或缺少訪問代碼。"
          }
        };
               
        const localizedMessages = messages[language] || messages["en"]; // Default to English if no translation found

        if (params.accessCode && !hasErrors) {

          const deepLink = `i6180://folder/Folder-${params.accessCode}`;

          navigator.clipboard.writeText(deepLink)
            .then(() => {
              // Use localized access success message if available, otherwise fallback to English
              const successMessage = localizedMessages.accessCodeSuccess || messages["en"].accessCodeSuccess;
              document.getElementById('inviteActionMessage').innerHTML = successMessage;

              setTimeout(() => {
                window.location.href = deepLink;
              }, 500); // Delay for smooth transition
            })
            .catch(() => {
              const failureMessage = localizedMessages.accessCodeFailure || messages["en"].accessCodeFailure;
              document.getElementById('inviteActionMessage').textContent = failureMessage;
            });

        } else {

          const errorMessage = localizedMessages.accessCodeError || messages["en"].accessCodeError;
          document.getElementById('inviteActionMessage').textContent = errorMessage;

        }

      }

      (function initializePage() {
        const language = getBrowserLanguage();
        const titleTemplate = setTranslations(language);
        const params = getPositionalUrlParameters();
        const uuidDateTime = getTimeFromUUIDv1(params.accessCode.split(':')[0]);
        let dateTime = uuidDateTime || new Date(new Date().getTime() - (6 * 60 * 1000 + 18 * 1000));

        if (!hasErrors) {
          setTitle(params.name, dateTime.toLocaleString(), titleTemplate);
        }

        if (params.accessCode) {
          document.getElementById('accessCodeDisplay').textContent = params.accessCode;
        } else {
          document.getElementById('accessCodeDisplay').textContent = "No access code provided";
        }
