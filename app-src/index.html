<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6180</title>
  <link rel="stylesheet" href="styles/styles.css">
  <link rel="icon" href="favicon.png" type="image/x-icon">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .header img {
      height: 40px;
    }

    .app-name {
      font-size: 24px;
      font-weight: 600;
      color: #222;
    }

    .content {
      padding: 60px 24px;
      text-align: center;
    }

    .content h1 {
      font-size: 28px;
      margin-bottom: 32px;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .button {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-decoration: none;
    }

    .button-primary {
      background-color: #007bff;
      color: white;
    }

    .button-primary:hover {
      background-color: #0056b3;
    }

    .button-secondary {
      background-color: #e2e6ea;
      color: #333;
    }

    .button-secondary:hover {
      background-color: #cfd4d8;
    }

    .footer {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 24px;
      font-size: 14px;
      background-color: #f1f3f5;
      border-top: 1px solid #dee2e6;
    }

    .footer a {
      color: #555;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    function openFilePicker() {
      document.getElementById('file-input').click();
    }

    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("file-input");

      input.addEventListener("change", function (e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        const readerPromises = files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = function (event) {
              resolve({
                fileName: file.name,
                dataUrl: event.target.result,
                type: file.type.startsWith("video") ? "video" : "image"
              });
            };
            reader.readAsDataURL(file);
          });
        });

        Promise.all(readerPromises).then(results => {
          localStorage.setItem("selectedPhotos", JSON.stringify(results));

          const folderId = crypto.randomUUID();
          window.location.href = `/app/save-album.html`;
        });
      });
    });
  </script>
</head>
<body>
  <div class="header">
    <img src="images/logo_no_background.png" alt="6180 Logo" />
    <div class="app-name">6180</div>
  </div>

  <div class="content">
    <h1>Create Albums To Share With Others</h1>
    <div class="button-group">
      <button class="button button-primary" onclick="openFilePicker()">Create Album</button>
      <a href="/app/my-albums.html" class="button button-secondary">View My Albums</a>
      <input type="file" id="file-input" accept="image/*,video/*" multiple style="display: none;">
    </div>
  </div>

  <div class="footer">
    <a href="terms.html">Terms of Service</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="support.html">Support</a>
  </div>
</body>
</html>
