<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>6180</title>
  <link rel="stylesheet" href="/styles/styles.css">
  <link rel="icon" href="/favicon.png" type="image/x-icon">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      margin-bottom: 10px;
    }

    .header .app-name {
      font-size: 1.4em;
      font-weight: bold;
      color: #222;
    }

    .header img {
      height: 32px;
    }

    .content {
      flex: 1;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.8em;
      margin: 40px 0;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 300px;
      margin: 0 auto;
    }

    .button {
      padding: 12px 20px;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
      text-align: center;
      display: inline-block;
    }

    .button-primary {
      background-color: #007bff;
      color: white;
    }

    .button-primary:hover {
      background-color: #0056b3;
    }

    .button-secondary {
      background-color: #e0e0e0;
      color: #333;
    }

    .button-secondary:hover {
      background-color: #cfcfcf;
    }

    .footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9em;
      color: #555;
    }

    .footer a {
      margin: 0 10px;
      color: #555;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
  <script type="module">
    function openFilePicker() {
      document.getElementById('file-input').click();
    }

    // ✅ make the function accessible from HTML
    window.openFilePicker = openFilePicker;

    document.addEventListener("DOMContentLoaded", function () {
      const input = document.getElementById("file-input");

      input.addEventListener("change", function (e) {
        const files = Array.from(e.target.files);
        if (!files.length) return;

        const readerPromises = files.map(file => {
          return new Promise(resolve => {
            const reader = new FileReader();
            reader.onload = function (event) {
              resolve({
                fileName: file.name,
                mimeType: file.type,
                dataUrl: event.target.result,
                type: file.type
              });
            };
            reader.readAsDataURL(file);
          });
        });

        Promise.all(readerPromises).then(results => {
          localStorage.setItem("selectedPhotos", JSON.stringify(results));
          window.location.href = "/app/save-album.html";
        });
      });
    });
  </script>
</head>
<body>
  <div class="header">
    <img src="/images/logo_no_background.png" alt="6180 Logo" />
    <div class="app-name">6180</div>
  </div>

  <div class="content">
    <h1>Create Albums To Share With Others</h1>
    <div class="button-group">
      <button class="button button-primary" onclick="openFilePicker()">Create Album</button>
      <a href="/app/my-albums.html" class="button button-secondary">View My Albums</a>
      <input type="file" id="file-input" accept="image/*,video/*" multiple style="display: none;">
    </div>
  </div>

  <div class="footer">
    <a href="/terms.html">Terms of Service</a>
    <a href="/privacy.html">Privacy Policy</a>
    <a href="/support.html">Support</a>
  </div>
</body>
</html>
