      // Store the selected language preference
      localStorage.setItem('user_language', lang);

    function detectPreferredLanguage() {
      // Check if there's a stored preference
      const storedLang = localStorage.getItem('user_language');
      if (storedLang && translations[storedLang]) {
        return storedLang;
      }
      
      // Check browser language
      const browserLang = navigator.language || navigator.userLanguage;
      
      // Try to match the exact language tag first
      if (translations[browserLang]) {
        return browserLang;
      }
      
      // Try to match the language part only (e.g., 'en' from 'en-GB')
      const langPart = browserLang.split('-')[0];
      if (translations[langPart]) {
        return langPart;
      }
      
      // Default to English
      return 'en';
